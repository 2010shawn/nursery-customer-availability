<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arizona Wholesale Growers Availability</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172018;background:#f3f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.hero{background:#fff;border:1px solid #d7ddd5;border-radius:22px;padding:24px;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#57705c}.hero h1{margin:5px 0 7px;font-size:clamp(28px,5vw,46px)}.sub{color:#5c675e}.tools{display:grid;grid-template-columns:1.5fr .7fr auto;gap:10px;margin:18px 0}.tools input,.tools select,.tools button{font:inherit;min-height:48px;border:1px solid #cbd3c9;border-radius:12px;padding:10px 12px;background:#fff}.tools button{font-weight:750;cursor:pointer}.status{margin:10px 0 18px;color:#5c675e}.list{background:#fff;border:1px solid #d7ddd5;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr 1fr .6fr;gap:12px;padding:15px;border-top:1px solid #e3e7e1}.row:first-child{border-top:0}.bot{font-weight:800}.common{font-size:13px;color:#657067}.qty{font-size:20px;font-weight:850}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#fff;border:1px solid #d7ddd5;border-radius:18px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover;background:#e9eee7}.cardBody{padding:14px}.size{display:inline-block;margin-top:8px;padding:4px 9px;background:#edf2eb;border-radius:999px;font-size:12px}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:#657067}@media(max-width:650px){.tools{grid-template-columns:1fr}.row{grid-template-columns:1fr .6fr}.row>div:nth-child(2){display:none}}
</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">Arizona Wholesale Growers</div><h1>Current Plant Availability</h1><div id="monthLabel" class="sub">Loading published availability…</div><p class="sub">Ready inventory aggregated across our growing facilities. Inventory is subject to prior sale.</p></section>
<div class="tools"><input id="search" placeholder="Search botanical or common name"><select id="size"><option value="">All sizes</option></select><button id="toggle">Photo View</button></div><div id="status" class="status"></div><div id="list" class="list"></div><div id="cards" class="cards hidden"></div></div>
<script>
const SUPABASE='https://yaobdnvvkfyzbsvrnxgf.supabase.co';const KEY='sb_publishable_niMYCWNf10L9x0iNMJ4ADw_jwrhdFkP';let rows=[],photoMode=false;
async function api(path,options={}){const h={apikey:KEY,Authorization:'Bearer '+KEY,...(options.headers||{})};const r=await fetch(SUPABASE+path,{...options,headers:h});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function signed(path){if(!path)return '';const r=await api('/storage/v1/object/sign/inventory-photos/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});const p=r.signedURL||r.signedUrl;return p?(p.startsWith('http')?p:SUPABASE+(p.startsWith('/storage/v1')?'':'/storage/v1')+p):''}
function filtered(){const q=document.querySelector('#search').value.toLowerCase().trim(),s=document.querySelector('#size').value;return rows.filter(r=>(!q||r.botanical_name.toLowerCase().includes(q)||r.common_name.toLowerCase().includes(q))&&(!s||r.container_size===s))}
async function render(){const data=filtered();const list=document.querySelector('#list'),cards=document.querySelector('#cards');list.innerHTML='';cards.innerHTML='';if(!data.length){(photoMode?cards:list).innerHTML='<div class="empty">No published availability matches these filters.</div>';return}if(!photoMode){data.forEach(r=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<div><div class="bot">${esc(r.botanical_name)}</div><div class="common">${esc(r.common_name)}</div></div><div>${esc(r.container_size)}</div><div><div class="qty">${Number(r.ready_count).toLocaleString()}</div><div class="common">Available</div></div>`;list.appendChild(d)})}else{for(const r of data){const url=await signed(r.crop_photo_path||r.individual_photo_path);const d=document.createElement('article');d.className='card';d.innerHTML=`${url?`<img src="${url}" alt="${esc(r.common_name)}">`:'<div style="height:190px;background:#e9eee7"></div>'}<div class="cardBody"><div class="bot">${esc(r.botanical_name)}</div><div class="common">${esc(r.common_name)}</div><span class="size">${esc(r.container_size)}</span><div class="qty" style="margin-top:10px">${Number(r.ready_count).toLocaleString()} available</div></div>`;cards.appendChild(d)}}}
async function load(){try{const months=await api('/rest/v1/customer_availability_snapshots?select=snapshot_month&order=snapshot_month.desc&limit=1');if(!months.length){document.querySelector('#status').textContent='No availability has been published yet.';render();return}const m=months[0].snapshot_month;rows=await api('/rest/v1/customer_availability_snapshots?select=*&snapshot_month=eq.'+encodeURIComponent(m)+'&order=botanical_name.asc,container_size.asc');document.querySelector('#monthLabel').textContent=new Date(m+'-01T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})+' Availability';const sizes=[...new Set(rows.map(r=>r.container_size))];document.querySelector('#size').innerHTML='<option value="">All sizes</option>'+sizes.map(s=>`<option>${esc(s)}</option>`).join('');document.querySelector('#status').textContent=rows.length+' plant/size combinations published.';render()}catch(e){document.querySelector('#status').textContent='Availability could not be loaded.';console.error(e)}}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#size').addEventListener('change',render);document.querySelector('#toggle').addEventListener('click',()=>{photoMode=!photoMode;document.querySelector('#list').classList.toggle('hidden',photoMode);document.querySelector('#cards').classList.toggle('hidden',!photoMode);document.querySelector('#toggle').textContent=photoMode?'List View':'Photo View';render()});load();
</script></body></html>
