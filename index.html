<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arizona Wholesale Growers Availability</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172018;background:#f3f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.hero{background:#fff;border:1px solid #d7ddd5;border-radius:22px;padding:24px;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#57705c}.hero h1{margin:5px 0 7px;font-size:clamp(28px,5vw,46px)}.sub{color:#5c675e}.tools{display:grid;grid-template-columns:1.5fr .7fr;gap:10px;margin:18px 0}.tools input,.tools select{font:inherit;min-height:48px;border:1px solid #cbd3c9;border-radius:12px;padding:10px 12px;background:#fff}.status{margin:10px 0 18px;color:#5c675e}.list{background:#fff;border:1px solid #d7ddd5;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(120px,.5fr) 84px;gap:12px;padding:12px 15px;border-top:1px solid #e3e7e1;align-items:center}.row:first-child{border-top:0}.bot{font-weight:800}.common{font-size:13px;color:#657067}.qty{font-size:20px;font-weight:850}.size{display:inline-block;margin-top:8px;padding:4px 9px;background:#edf2eb;border-radius:999px;font-size:12px}.hidden{display:none!important}.thumbBtn{border:0;background:transparent;padding:0;cursor:pointer}.thumb{width:68px;height:52px;object-fit:cover;border-radius:9px;border:1px solid #cfd6cd;display:block}.noPhoto{font-size:12px;color:#7a847c}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}.modal[hidden]{display:none}.modalBox{position:relative;max-width:min(920px,95vw);max-height:92vh}.modal img{display:block;max-width:95vw;max-height:88vh;border-radius:14px;background:#fff}.closeModal{position:absolute;right:-10px;top:-10px;width:38px;height:38px;border:0;border-radius:999px;background:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.25)}.empty{padding:30px;text-align:center;color:#657067}@media(max-width:650px){.tools{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) auto 72px}.thumb{width:58px;height:46px}}
</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">Arizona Wholesale Growers</div><h1>Current Plant Availability</h1><div id="monthLabel" class="sub">Loading published availability…</div><p class="sub">Current plant availability across our growing facilities. Availability is subject to prior sale and confirmation.</p></section>
<div class="tools"><input id="search" placeholder="Search botanical or common name"><select id="size"><option value="">All sizes</option></select></div><div id="status" class="status"></div><div id="list" class="list"></div><div id="photoModal" class="modal" hidden><div class="modalBox"><button id="closeModal" class="closeModal" aria-label="Close photo">×</button><img id="modalImage" alt=""></div></div></div>
<script>
const SUPABASE='https://yaobdnvvkfyzbsvrnxgf.supabase.co';const KEY='sb_publishable_niMYCWNf10L9x0iNMJ4ADw_jwrhdFkP';let rows=[];
async function api(path,options={}){const h={apikey:KEY,Authorization:'Bearer '+KEY,...(options.headers||{})};const r=await fetch(SUPABASE+path,{...options,headers:h});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function signed(path){if(!path)return '';try{const r=await api('/storage/v1/object/sign/inventory-photos/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});const p=r.signedURL||r.signedUrl;return p?(p.startsWith('http')?p:SUPABASE+(p.startsWith('/storage/v1')?'':'/storage/v1')+p):''}catch(e){console.warn('Photo unavailable',path,e);return ''}}
function normSize(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
function filtered(){const q=document.querySelector('#search').value.toLowerCase().trim(),selected=normSize(document.querySelector('#size').value);return rows.filter(r=>{const bot=String(r.botanical_name||'').toLowerCase(),common=String(r.common_name||'').toLowerCase();const matchesText=!q||bot.includes(q)||common.includes(q);const matchesSize=!selected||normSize(r.container_size)===selected;return matchesText&&matchesSize})}
async function render(){
  const data=filtered(),list=document.querySelector('#list');
  list.innerHTML='';
  if(!data.length){list.innerHTML='<div class="empty">No published availability matches these filters.</div>';return}
  for(const r of data){
    const url=await signed(r.crop_photo_path||r.individual_photo_path);
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`<div><div class="bot">${esc(r.botanical_name)}</div><div class="common">${esc(r.common_name)}</div></div><div><span class="size">${esc(r.container_size)}</span></div><div>${url?`<button class="thumbBtn" type="button" aria-label="View photo of ${esc(r.common_name)}"><img class="thumb" src="${url}" alt="${esc(r.common_name)}"></button>`:'<span class="noPhoto">No photo</span>'}</div>`;
    if(url){d.querySelector('.thumbBtn').addEventListener('click',()=>openPhoto(url,r.common_name||r.botanical_name))}
    list.appendChild(d);
  }
}
function openPhoto(url,label){
  const modal=document.querySelector('#photoModal'),img=document.querySelector('#modalImage');
  img.src=url;img.alt=label||'Plant photo';modal.hidden=false;document.body.style.overflow='hidden';
}
function closePhoto(){document.querySelector('#photoModal').hidden=true;document.querySelector('#modalImage').src='';document.body.style.overflow=''}
async function load(){try{const months=await api('/rest/v1/customer_availability_snapshots?select=snapshot_month&order=snapshot_month.desc&limit=1');if(!months.length){document.querySelector('#status').textContent='No availability has been published yet.';render();return}const m=months[0].snapshot_month;rows=await api('/rest/v1/customer_availability_snapshots?select=*&snapshot_month=eq.'+encodeURIComponent(m)+'&order=botanical_name.asc,container_size.asc');document.querySelector('#monthLabel').textContent=new Date(m+'-01T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})+' Availability';const sizeMap=new Map();rows.forEach(r=>{const label=String(r.container_size||'').trim();if(label&&!sizeMap.has(normSize(label)))sizeMap.set(normSize(label),label)});const sizes=[...sizeMap.values()];document.querySelector('#size').innerHTML='<option value="">All sizes</option>'+sizes.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');document.querySelector('#status').textContent=rows.length+' plant/size combinations currently listed.';render()}catch(e){document.querySelector('#status').textContent='Availability could not be loaded.';console.error(e)}}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#size').addEventListener('change',render);document.querySelector('#closeModal').addEventListener('click',closePhoto);document.querySelector('#photoModal').addEventListener('click',e=>{if(e.target.id==='photoModal')closePhoto()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto()});load();
</script></body></html>
